<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Carousel</title>
    <style>
        /* Carousel container styling */
        .carousel {
            width: 100%;
            max-width: 800px;
            height: 400px;
            margin: auto;
            overflow: hidden;
            position: relative;
            border: 1px solid black;
        }

        /* Carousel slides styling */
        .slides {
            display: flex;
            width: 500%; /* 5 images, adjust as necessary */
            transition: transform 1s ease-in-out;
        }

        /* Slide image styling */
        .slides img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Navigation dots container */
        .nav-dots {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }

        /* Individual dot styling */
        .dot {
            width: 15px;
            height: 15px;
            background-color: #bbb;
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        /* Active dot styling */
        .dot.active {
            background-color: #333;
        }
    </style>
</head>
<body>

    <!-- Image Carousel -->
    <div class="carousel">
        <div class="slides" id="slides">
            <img src="./Site_Images/KUK_logo.JPG" alt="Slide 1">
            <img src="./Site_Images/KUK_logo1.JPG" alt="Slide 2">
            <img src="./Site_Images/KUKSolutions_bkrd.png" alt="Slide 3">
            <img src="./Site_Images/Placeholder_welcoming scene.webp" alt="Slide 4">
            <img src="./Site_Images/PrepareForInterview.JPG" alt="Slide 5">
        </div>

        <!-- Navigation Dots -->
        <div class="nav-dots">
            <span class="dot active" data-slide="0"></span>
            <span class="dot" data-slide="1"></span>
            <span class="dot" data-slide="2"></span>
            <span class="dot" data-slide="3"></span>
            <span class="dot" data-slide="4"></span>
        </div>
    </div>

    <script>
        const slides = document.getElementById('slides');
        const dots = document.querySelectorAll('.dot');
        let currentIndex = 0;
        let autoSlideInterval;

        // Function to go to a specific slide
        function goToSlide(index) {
            currentIndex = index;
            slides.style.transform = `translateX(-${index * 100}%)`;

            // Update active dot
            dots.forEach(dot => dot.classList.remove('active'));
            dots[index].classList.add('active');
        }

        // Start automatic sliding
        function startAutoSlide() {
            autoSlideInterval = setInterval(() => {
                currentIndex = (currentIndex + 1) % dots.length;
                goToSlide(currentIndex);
            }, 3000);  // Slide changes every 3 seconds
        }

        // Stop auto-slide on hover
        document.querySelector('.carousel').addEventListener('mouseenter', () => {
            clearInterval(autoSlideInterval);
        });

        // Resume auto-slide on mouse leave
        document.querySelector('.carousel').addEventListener('mouseleave', () => {
            startAutoSlide();
        });

        // Event listeners for dots
        dots.forEach((dot, index) => {
            dot.addEventListener('click', () => {
                clearInterval(autoSlideInterval); // Stop the auto-slide
                goToSlide(index); // Go to clicked dot
                startAutoSlide(); // Restart auto-slide
            });
        });

        // Initialize auto-slide
        startAutoSlide();
    </script>
</body>
</html>
