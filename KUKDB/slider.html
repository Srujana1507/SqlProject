<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Carousel</title>
    <style>
          .carousel {
            width: 100%;
            max-width: 800px;
            height: 400px;
            margin: auto;
            overflow: hidden;
            position: relative;
            border: 1px solid black;
        }

        /* Carousel slides styling */
        .slides {
            display: flex;
            width: 500%;         /* 5 images */
            transition: transform 1s ease-in-out; /* Smooth transition for sliding */
            animation: slideLeft 20s infinite linear; 
        }

        /* Slide image styling */
        .slides img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Keyframes for sliding from right to left
        @keyframes slideLeft {
            0% { transform: translateX(0); }
            100% { transform: translateX(-400%); } /* Moves to the last image 
        } */
        /* Pause animation on hover */
                .carousel:hover .slides {
                    animation-play-state: paused;
                }
        /* Navigation dots container */
        .nav-dots {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }

        /* Individual dot styling */
        .dot {
            width: 15px;
            height: 15px;
            background-color: #bbb;
            border-radius: 50%;
            display: flex;
            gap: 10px; 
            cursor: pointer;
            transition: background-color 0.3s;
        }

        /* Active dot styling */
        .dot.active {
            background-color: #333;
        }
    </style>
</head>
<body>

     <!-- Image Carousel -->
     <div class="carousel">
        <div class="slides" id="slides">
